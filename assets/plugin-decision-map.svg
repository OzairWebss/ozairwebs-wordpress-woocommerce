<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 680" role="img"><title>Choose the smallest maintainable solution</title><desc>Define the rule: Who may perform the action?, Which records can change?, What must survive a theme?; Check configuration: Can core settings express it?, Is behaviour documented?, Can an owner maintain it?; Review extensions: Supported versions and APIs, Licensing and data access, Compatibility and recovery; Scope custom code: Explicit inputs and outputs, Capabilities and validation, Supported storage interfaces; Test the boundary: Allowed and denied requests, Retry and duplicate events, Upgrade and uninstall behaviour; Handover: Installation and rollback, Operational owner and notes, Maintenance commitments</desc><defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#131513"/><stop offset="1" stop-color="#252d29"/></linearGradient><linearGradient id="card" x2="0" y2="1"><stop stop-color="#354039"/><stop offset="1" stop-color="#202822"/></linearGradient><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="none" stroke="#ff9b24" stroke-width="1.8"/></marker></defs><rect width="1400" height="680" rx="28" fill="url(#bg)"/><text x="54" y="55" font-family="Segoe UI,Arial,sans-serif" font-size="18" fill="#ff9b24" font-weight="700">OZAIRWEBS / PRACTICAL KNOWLEDGE</text><text x="54" y="109" font-family="Segoe UI,Arial,sans-serif" font-size="37" fill="#faf2e3" font-weight="700">Choose the smallest maintainable solution</text><text x="54" y="155" font-family="Segoe UI,Arial,sans-serif" font-size="22" fill="#e0e5df" font-weight="400">Compare supported configuration, existing extensions and custom business logic.</text><rect x="62" y="220" width="405" height="166" rx="17" fill="#090e0b"/><rect x="54" y="210" width="405" height="166" rx="17" fill="url(#card)" stroke="#718074"/><rect x="54" y="210" width="405" height="5" rx="2" fill="#ff9b24"/><text x="74" y="248" font-family="Segoe UI,Arial,sans-serif" font-size="25" fill="#fff5e6" font-weight="650">01  Define the rule</text><text x="74" y="286" font-family="Segoe UI,Arial,sans-serif" font-size="21" fill="#e0e5df" font-weight="400">Who may perform the action?</text><text x="74" y="316" font-family="Segoe UI,Arial,sans-serif" font-size="21" fill="#e0e5df" font-weight="400">Which records can change?</text><text x="74" y="346" font-family="Segoe UI,Arial,sans-serif" font-size="21" fill="#e0e5df" font-weight="400">What must survive a theme?</text><path d="M464 295 H487" stroke="#ff9b24" stroke-width="3" marker-end="url(#arrow)"/><rect x="504" y="220" width="405" height="166" rx="17" fill="#090e0b"/><rect x="496" y="210" width="405" height="166" rx="17" fill="url(#card)" stroke="#718074"/><rect x="496" y="210" width="405" height="5" rx="2" fill="#ff9b24"/><text x="516" y="248" font-family="Segoe UI,Arial,sans-serif" font-size="25" fill="#fff5e6" font-weight="650">02  Check configuration</text><text x="516" y="286" font-family="Segoe UI,Arial,sans-serif" font-size="21" fill="#e0e5df" font-weight="400">Can core settings express it?</text><text x="516" y="316" font-family="Segoe UI,Arial,sans-serif" font-size="21" fill="#e0e5df" font-weight="400">Is behaviour documented?</text><text x="516" y="346" font-family="Segoe UI,Arial,sans-serif" font-size="21" fill="#e0e5df" font-weight="400">Can an owner maintain it?</text><path d="M906 295 H929" stroke="#ff9b24" stroke-width="3" marker-end="url(#arrow)"/><rect x="946" y="220" width="405" height="166" rx="17" fill="#090e0b"/><rect x="938" y="210" width="405" height="166" rx="17" fill="url(#card)" stroke="#718074"/><rect x="938" y="210" width="405" height="5" rx="2" fill="#ff9b24"/><text x="958" y="248" font-family="Segoe UI,Arial,sans-serif" font-size="25" fill="#fff5e6" font-weight="650">03  Review extensions</text><text x="958" y="286" font-family="Segoe UI,Arial,sans-serif" font-size="21" fill="#e0e5df" font-weight="400">Supported versions and APIs</text><text x="958" y="316" font-family="Segoe UI,Arial,sans-serif" font-size="21" fill="#e0e5df" font-weight="400">Licensing and data access</text><text x="958" y="346" font-family="Segoe UI,Arial,sans-serif" font-size="21" fill="#e0e5df" font-weight="400">Compatibility and recovery</text><rect x="62" y="420" width="405" height="166" rx="17" fill="#090e0b"/><rect x="54" y="410" width="405" height="166" rx="17" fill="url(#card)" stroke="#718074"/><rect x="54" y="410" width="405" height="5" rx="2" fill="#ff9b24"/><text x="74" y="448" font-family="Segoe UI,Arial,sans-serif" font-size="25" fill="#fff5e6" font-weight="650">04  Scope custom code</text><text x="74" y="486" font-family="Segoe UI,Arial,sans-serif" font-size="21" fill="#e0e5df" font-weight="400">Explicit inputs and outputs</text><text x="74" y="516" font-family="Segoe UI,Arial,sans-serif" font-size="21" fill="#e0e5df" font-weight="400">Capabilities and validation</text><text x="74" y="546" font-family="Segoe UI,Arial,sans-serif" font-size="21" fill="#e0e5df" font-weight="400">Supported storage interfaces</text><path d="M464 495 H487" stroke="#ff9b24" stroke-width="3" marker-end="url(#arrow)"/><rect x="504" y="420" width="405" height="166" rx="17" fill="#090e0b"/><rect x="496" y="410" width="405" height="166" rx="17" fill="url(#card)" stroke="#718074"/><rect x="496" y="410" width="405" height="5" rx="2" fill="#ff9b24"/><text x="516" y="448" font-family="Segoe UI,Arial,sans-serif" font-size="25" fill="#fff5e6" font-weight="650">05  Test the boundary</text><text x="516" y="486" font-family="Segoe UI,Arial,sans-serif" font-size="21" fill="#e0e5df" font-weight="400">Allowed and denied requests</text><text x="516" y="516" font-family="Segoe UI,Arial,sans-serif" font-size="21" fill="#e0e5df" font-weight="400">Retry and duplicate events</text><text x="516" y="546" font-family="Segoe UI,Arial,sans-serif" font-size="21" fill="#e0e5df" font-weight="400">Upgrade and uninstall behaviour</text><path d="M906 495 H929" stroke="#ff9b24" stroke-width="3" marker-end="url(#arrow)"/><rect x="946" y="420" width="405" height="166" rx="17" fill="#090e0b"/><rect x="938" y="410" width="405" height="166" rx="17" fill="url(#card)" stroke="#718074"/><rect x="938" y="410" width="405" height="5" rx="2" fill="#ff9b24"/><text x="958" y="448" font-family="Segoe UI,Arial,sans-serif" font-size="25" fill="#fff5e6" font-weight="650">06  Handover</text><text x="958" y="486" font-family="Segoe UI,Arial,sans-serif" font-size="21" fill="#e0e5df" font-weight="400">Installation and rollback</text><text x="958" y="516" font-family="Segoe UI,Arial,sans-serif" font-size="21" fill="#e0e5df" font-weight="400">Operational owner and notes</text><text x="958" y="546" font-family="Segoe UI,Arial,sans-serif" font-size="21" fill="#e0e5df" font-weight="400">Maintenance commitments</text><text x="54" y="644" font-family="Segoe UI,Arial,sans-serif" font-size="21" fill="#ffb652" font-weight="600">A custom plugin is a scoped engineering decision, not the default answer to every request.</text></svg>