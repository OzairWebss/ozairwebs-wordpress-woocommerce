<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 680" role="img"><title>Commerce controls: from catalogue to recovery</title><desc>Catalogue truth: Variants and availability, Price, tax and shipping rules, Named data owner; Checkout validation: Supported checkout mode, Stock and input validation, Gateway-specific acceptance; Order transition: Verified payment callbacks, COD: confirm collection later, Duplicate event handling; Fulfilment: Controlled state changes, Idempotent courier requests, Customer communication; Reconciliation: Refunds and stock restoration, Compare provider and orders, Investigate missing events; Recovery: Test restore on staging, Document cutover and rollback, Assign operational ownership</desc><defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#131513"/><stop offset="1" stop-color="#252d29"/></linearGradient><linearGradient id="card" x2="0" y2="1"><stop stop-color="#354039"/><stop offset="1" stop-color="#202822"/></linearGradient><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="none" stroke="#ff9b24" stroke-width="1.8"/></marker></defs><rect width="1400" height="680" rx="28" fill="url(#bg)"/><text x="54" y="55" font-family="Segoe UI,Arial,sans-serif" font-size="18" fill="#ff9b24" font-weight="700">OZAIRWEBS / PRACTICAL KNOWLEDGE</text><text x="54" y="109" font-family="Segoe UI,Arial,sans-serif" font-size="37" fill="#faf2e3" font-weight="700">Commerce controls: from catalogue to recovery</text><text x="54" y="155" font-family="Segoe UI,Arial,sans-serif" font-size="22" fill="#e0e5df" font-weight="400">Illustrative review map. Follow the implemented gateway and fulfilment rules.</text><rect x="62" y="220" width="405" height="166" rx="17" fill="#090e0b"/><rect x="54" y="210" width="405" height="166" rx="17" fill="url(#card)" stroke="#718074"/><rect x="54" y="210" width="405" height="5" rx="2" fill="#ff9b24"/><text x="74" y="248" font-family="Segoe UI,Arial,sans-serif" font-size="25" fill="#fff5e6" font-weight="650">01  Catalogue truth</text><text x="74" y="286" font-family="Segoe UI,Arial,sans-serif" font-size="21" fill="#e0e5df" font-weight="400">Variants and availability</text><text x="74" y="316" font-family="Segoe UI,Arial,sans-serif" font-size="21" fill="#e0e5df" font-weight="400">Price, tax and shipping rules</text><text x="74" y="346" font-family="Segoe UI,Arial,sans-serif" font-size="21" fill="#e0e5df" font-weight="400">Named data owner</text><path d="M464 295 H487" stroke="#ff9b24" stroke-width="3" marker-end="url(#arrow)"/><rect x="504" y="220" width="405" height="166" rx="17" fill="#090e0b"/><rect x="496" y="210" width="405" height="166" rx="17" fill="url(#card)" stroke="#718074"/><rect x="496" y="210" width="405" height="5" rx="2" fill="#ff9b24"/><text x="516" y="248" font-family="Segoe UI,Arial,sans-serif" font-size="25" fill="#fff5e6" font-weight="650">02  Checkout validation</text><text x="516" y="286" font-family="Segoe UI,Arial,sans-serif" font-size="21" fill="#e0e5df" font-weight="400">Supported checkout mode</text><text x="516" y="316" font-family="Segoe UI,Arial,sans-serif" font-size="21" fill="#e0e5df" font-weight="400">Stock and input validation</text><text x="516" y="346" font-family="Segoe UI,Arial,sans-serif" font-size="21" fill="#e0e5df" font-weight="400">Gateway-specific acceptance</text><path d="M906 295 H929" stroke="#ff9b24" stroke-width="3" marker-end="url(#arrow)"/><rect x="946" y="220" width="405" height="166" rx="17" fill="#090e0b"/><rect x="938" y="210" width="405" height="166" rx="17" fill="url(#card)" stroke="#718074"/><rect x="938" y="210" width="405" height="5" rx="2" fill="#ff9b24"/><text x="958" y="248" font-family="Segoe UI,Arial,sans-serif" font-size="25" fill="#fff5e6" font-weight="650">03  Order transition</text><text x="958" y="286" font-family="Segoe UI,Arial,sans-serif" font-size="21" fill="#e0e5df" font-weight="400">Verified payment callbacks</text><text x="958" y="316" fon