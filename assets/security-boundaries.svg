<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 680" role="img"><title>Security review: verify each boundary</title><desc>Identity: Protect account access, Restrict privileged roles, Review session behaviour; Permission: Check capabilities, Check access to the record, Deny unauthorized actions; Request integrity: Validate inputs and actions, A nonce is not authorization, Escape output for its context; External interfaces: Review endpoints and keys, Verify signed callbacks, Avoid sensitive public logs; Dependencies: Record supported versions, Review extension advisories, Test updates before cutover; Recovery evidence: Private encrypted backups, Verify restore, not just upload, Record incident ownership</desc><defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#131513"/><stop offset="1" stop-color="#252d29"/></linearGradient><linearGradient id="card" x2="0" y2="1"><stop stop-color="#354039"/><stop offset="1" stop-color="#202822"/></linearGradient><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="none" stroke="#ff9b24" stroke-width="1.8"/></marker></defs><rect width="1400" height="680" rx="28" fill="url(#bg)"/><text x="54" y="55" font-family="Segoe UI,Arial,sans-serif" font-size="18" fill="#ff9b24" font-weight="700">OZAIRWEBS / PRACTICAL KNOWLEDGE</text><text x="54" y="109" font-family="Segoe UI,Arial,sans-serif" font-size="37" fill="#faf2e3" font-weight="700">Security review: verify each boundary</text><text x="54" y="155" font-family="Segoe UI,Arial,sans-serif" font-size="22" fill="#e0e5df" font-weight="400">Use these checks together; one passing control cannot replace the others.</text><rect x="62" y="220" width="405" height="166" rx="17" fill="#090e0b"/><rect x="54" y="210" width="405" height="166" rx="17" fill="url(#card)" stroke="#718074"/><rect x="54" y="210" width="405" height="5" rx="2" fill="#ff9b24"/><text x="74" y="248" font-family="Segoe UI,Arial,sans-serif" font-size="25" fill="#fff5e6" font-weight="650">01  Identity</text><text x="74" y="286" font-family="Segoe UI,Arial,sans-serif" font-size="21" fill="#e0e5df" font-weight="400">Protect account access</text><text x="74" y="316" font-family="Segoe UI,Arial,sans-serif" font-size="21" fill="#e0e5df" font-weight="400">Restrict privileged roles</text><text x="74" y="346" font-family="Segoe UI,Arial,sans-serif" font-size="21" fill="#e0e5df" font-weight="400">Review session behaviour</text><path d="M464 295 H487" stroke="#ff9b24" stroke-width="3" marker-end="url(#arrow)"/><rect x="504" y="220" width="405" height="166" rx="17" fill="#090e0b"/><rect x="496" y="210" width="405" height="166" rx="17" fill="url(#card)" stroke="#718074"/><rect x="496" y="210" width="405" height="5" rx="2" fill="#ff9b24"/><text x="516" y="248" font-family="Segoe UI,Arial,sans-serif" font-size="25" fill="#fff5e6" font-weight="650">02  Permission</text><text x="516" y="286" font-family="Segoe UI,Arial,sans-serif" font-size="21" fill="#e0e5df" font-weight="400">Check capabilities</text><text x="516" y="316" font-family="Segoe UI,Arial,sans-serif" font-size="21" fill="#e0e5df" font-weight="400">Check access to the record</text><text x="516" y="346" font-family="Segoe UI,Arial,sans-serif" font-size="21" fill="#e0e5df" font-weight="400">Deny unauthorized actions</text><path d="M906 295 H929" stroke="#ff9b24" stroke-width="3" marker-end="url(#arrow)"/><rect x="946" y="220" width="405" height="166" rx="17" fill="#090e0b"/><rect x="938" y="210" width="405" height="166" rx="17" fill="url(#card)" stroke="#718074"/><rect x="938" y="210" width="405" height="5" rx="2" fill="#ff9b24"/><text x="958" y="248" font-family="Segoe UI,Arial,sans-serif" font-size="25" fill="#fff5e6" font-weight="650">03  Request integrity</text><text x="958" y="286" font-family="Segoe UI,Arial,sans-serif" font-size="21" fill="#e0e5df" font-weight="400">Validate inputs and actions</text><text x="958" y="316" font-family="Segoe UI,Arial,sans-serif" font-size="21" fill="#e0e5df" font-weight="400">A nonce is not authorization</text><text x="958" y="346" font-family="Segoe UI,Arial,sans-serif" font-size="21" fill="#e0e5df" font-weight="400">Escape output for its context</text><rect x="62" y="420" width="405" height="166" rx="17" fill="#090e0b"/><rect x="54" y="410" width="405" height="166" rx="17" fill="url(#card)" stroke="#718074"/><rect x="54" y="410" width="405" height="5" rx="2" fill="#ff9b24"/><text x="74" y="448" font-family="Segoe UI,Arial,sans-serif" font-size="25" fill="#fff5e6" font-weight="650">04  External interfaces</text><text x="74" y="486" font-family="Segoe UI,Arial,sans-serif" font-size="21" fill="#e0e5df" font-weight="400">Review endpoints and keys</text><text x="74" y="516" font-family="Segoe UI,Arial,sans-serif" font-size="21" fill="#e0e5df" font-weight="400">Verify signed callbacks</text><text x="74" y="546" font-family="Segoe UI,Arial,sans-serif" font-size="21" fill="#e0e5df" font-weight="400">Avoid sensitive public logs</text><path d="M464 495 H487" stroke="#ff9b24" stroke-width="3" marker-end="url(#arrow)"/><rect x="504" y="420" width="405" height="166" rx="17" fill="#090e0b"/><rect x="496" y="410" width="405" height="166" rx="17" fill="url(#card)" stroke="#718074"/><rect x="496" y="410" width="405" height="5" rx="2" fill="#ff9b24"/><text x="516" y="448" font-family="Segoe UI,Arial,sans-serif" font-size="25" fill="#fff5e6" font-weight="650">05  Dependencies</text><text x="516" y="486" font-family="Segoe UI,Arial,sans-serif" font-size="21" fill="#e0e5df" font-weight="400">Record supported versions</text><text x="516" y="516" font-family="Segoe UI,Arial,sans-serif" font-size="21" fill="#e0e5df" font-weight="400">Review extension advisories</text><text x="516" y="546" font-family="Segoe UI,Arial,sans-serif" font-size="21" fill="#e0e5df" font-weight="400">Test updates before cutover</text><path d="M906 495 H929" stroke="#ff9b24" stroke-width="3" marker-end="url(#arrow)"/><rect x="946" y="420" width="405" height="166" rx="17" fill="#090e0b"/><rect x="938" y="410" width="405" height="166" rx="17" fill="url(#card)" stroke="#718074"/><rect x="938" y="410" width="405" height="5" rx="2" fill="#ff9b24"/><text x="958" y="448" font-family="Segoe UI,Arial,sans-serif" font-size="25" fill="#fff5e6" font-weight="650">06  Recovery evidence</text><text x="958" y="486" font-family="Segoe UI,Arial,sans-serif" font-size="21" fill="#e0e5df" font-weight="400">Private encrypted backups</text><text x="958" y="516" font-family="Segoe UI,Arial,sans-serif" font-size="21" fill="#e0e5df" font-weight="400">Verify restore, not just upload</text><text x="958" y="546" font-family="Segoe UI,Arial,sans-serif" font-size="21" fill="#e0e5df" font-weight="400">Record incident ownership</text><text x="54" y="644" font-family="Segoe UI,Arial,sans-serif" font-size="21" fill="#ffb652" font-weight="600">Conceptual controls, not a certification or a claim that a site has passed an audit.</text></svg>